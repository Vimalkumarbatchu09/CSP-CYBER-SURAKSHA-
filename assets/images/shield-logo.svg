<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#0c1425" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
  <!-- Glowing Shield -->
  <path d="M100,30 L160,55 C160,115 100,165 100,165 C100,165 40,115 40,55 Z" 
        fill="url(#cyberShieldGrad)" opacity="0.15" stroke="url(#cyberShieldGrad)" stroke-width="4" filter="url(#cyberGlow)"/>
  <!-- Inner Shield Core -->
  <path d="M100,45 L145,65 C145,110 100,150 100,150 C100,150 55,110 55,65 Z" 
        fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
  <!-- Keyhole / Padlock Icon -->
  <circle cx="100" cy="90" r="14" fill="#00f2fe" />
  <path d="M94,94 L106,94 L110,120 L90,120 Z" fill="#00f2fe" />
  <!-- Circuit Nodes -->
  <circle cx="40" cy="55" r="4" fill="#00f2fe"/>
  <circle cx="160" cy="55" r="4" fill="#00f2fe"/>
  <circle cx="100" cy="165" r="4" fill="#00f2fe"/>
</svg>
